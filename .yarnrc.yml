# Yarn v4.10+

# Only consider npm package versions published at least  7 days ago
npmMinimalAgeGate: "7d"

# These packages bypass the age gate (package descriptors or glob patterns)
npmPreApprovedPackages:
  - "@types/react"
  - "@types/node"
  - "@types/react-dom"
  - "@types/react-router-dom"
  - "typescript"